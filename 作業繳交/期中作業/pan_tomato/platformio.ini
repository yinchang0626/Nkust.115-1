[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200

; --- 強制深度搜尋依賴庫 ---
lib_ldf_mode = deep

lib_deps = 
    SPI
    Wire
    lvgl/lvgl @ ^8.3.11
    bodmer/TFT_eSPI @ ^2.5.43
    adafruit/RTClib @ ^2.1.3

build_flags = 
    ; 告訴 LVGL 直接引用 src 中的設定檔
    -D LV_CONF_INCLUDE_SIMPLE
    ; 設定檔放在 src 資料夾中
    -I src

    ; --- 移除 LV_CONF_SKIP，讓 src/lv_conf.h 生效 ---
    ; (已移除 -D LV_CONF_SKIP)
    ; (已移除重複的 LV_TICK_CUSTOM, LV_COLOR_16_SWAP, 字型設定等)

    ; --- TFT_eSPI 驅動設定 (ST7735 128x160) ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_RGB_ORDER=TFT_RGB
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    
    ; 腳位設定 (NodeMCU-32S) - 已更新為安全腳位
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=16   ; [修改] 替換掉危險的 5
    -D TFT_DC=17   ; [修改] 替換掉會阻礙燒錄的 2
    -D TFT_RST=19  ; [修改] 替換掉 4
    
    ; 效能設定
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=20000000